name: Sync live progress

on:
  repository_dispatch:
    types: [progress-updated]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-live-progress
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Playbook
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out published progress contract
        uses: actions/checkout@v4
        with:
          repository: RaghhavMalani/leetcode-progress
          path: .progress-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import progress.json
        run: npm run sync:progress:contract -- .progress-source/progress.json

      - name: Import personal replay traces
        run: npm run sync:replays -- .progress-source

      - name: Verify imported snapshot
        run: |
          npm run typecheck
          npx vitest run tests/progress.test.ts tests/replay-lab.test.ts
          npm run build

      - name: Commit snapshot and trigger the deployment rebuild
        shell: bash
        run: |
          if git diff --quiet -- src/data/progress.generated.ts src/data/replays.generated.ts; then
            echo "The Playbook snapshot and replay lab already match progress.json."
            exit 0
          fi
          SOURCE_COMMIT=$(node -p "JSON.parse(require('node:fs').readFileSync('.progress-source/progress.json','utf8')).sourceCommit")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/progress.generated.ts src/data/replays.generated.ts
          git commit -m "chore(progress): sync ${SOURCE_COMMIT:0:7}"
          git push
