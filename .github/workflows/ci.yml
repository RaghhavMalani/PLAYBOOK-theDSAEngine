name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check out progress snapshot source
        uses: actions/checkout@v4
        with:
          repository: RaghhavMalani/leetcode-progress
          path: .progress-source

      - name: Progress snapshot must be current
        run: |
          npm run sync:progress:contract -- .progress-source/progress.json
          git diff --exit-code -- src/data/progress.generated.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Content tests
        run: npx vitest run

      - name: Python snippets must parse
        run: python3 scripts/check-snippets.py

      - name: Production build
        run: npm run build
