name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Committed progress snapshot must be present
        run: |
          test -s src/data/progress.generated.ts
          echo "::warning file=src/data/progress.generated.ts::PR CI validates the committed snapshot; freshness is enforced by sync-progress.yml."

      - name: Typecheck
        run: npm run typecheck

      - name: Content tests
        run: npx vitest run

      - name: Python snippets must parse
        run: python3 scripts/check-snippets.py

      - name: Production build
        run: npm run build
